        body {

        .container {

        /* --- بخش ويژگيها (Features) --- */
        .features {

            justify-content: space-around;
            flex-wrap: wrap;
            margin-top: 30px;
        }

        /* اينجا کلاس feature-item تعريف شده است */
        .feature-item {
            background: #ecf0f1;
            padding: 20px;
            border-radius: 10px;
            width: 20%; /* عرض هر آيتم */
            text-align: center;
            margin: 10px;
            transition: transform 0.3s;
        }

        .feature-item:hover {
            transform: translateY(-10px);
        }

        .feature-item h3 {
            color: #e67e22;

            font-size: 1.1em;
        }

        /* --- بخش جدول قيمت (Price Table) --- */
        .price-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        .price-table th {
            background-color: #2c3e50;
            color: white;
            padding: 12px;
        }

        .price-table td {
            padding: 12px;
            text-align: center;
            border-bottom: 1px solid #eee;
        }

        .price-table tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        .price-table tr:hover {
            background-color: #e1f5fe;
        }

        /* کلاسهاي رنگي براي قيمتها */
        .price-up { color: #27ae60; font-weight: bold; }
        .price-down { color: #e74c3c; font-weight: bold; }

        /* --- بخش دکمهها (Buttons) --- */
        /* اينجا کلاس cta-button تعريف شده است */
        .cta-button {
            display: block;
            width: 220px;
            margin: 40px auto;

            padding: 15px;
            background-color: #e67e22;
            color: white;
            text-align: center;
            text-decoration: none;
            font-weight: bold;
            border-radius: 50px;
            transition: 0.3s;
        }

        .cta-button:hover {
            background-color: #d35400;
        }

        /* کلاس دکمههاي داخل جدول */
        .buy-btn {
            padding: 5px 15px;
            background-color: #3498db;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            font-size: 0.8em;
        }

        footer { text-align: center; margin-top: 40px; color: #bdc3c7; }
